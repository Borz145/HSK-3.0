<head>

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>HSK 3.0 · тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: одна узкая колонка-тетрадь, сверху уровень и вкладки, ниже рабочая область */
:root{
  --bg:#EEF2F1;--card:#FFFFFF;--ink:#15211F;--sub:#5A6966;--line:#D3DCDA;
  --ac:#0E6B5C;--acink:#FFFFFF;--hl:#E1F0EC;--bad:#B23A2E;--badbg:#F7E4E1;--seal:#B23A2E;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-han:"Noto Serif SC","Songti SC","SimSun",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171A;--card:#19232A;--ink:#E5ECEA;--sub:#93A3A0;--line:#2A3842;
  --ac:#5CC4B0;--acink:#0C1A17;--hl:#173A35;--bad:#F08A7E;--badbg:#3A1F1C;--seal:#E0685A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171A;--card:#19232A;--ink:#E5ECEA;--sub:#93A3A0;--line:#2A3842;
  --ac:#5CC4B0;--acink:#0C1A17;--hl:#173A35;--bad:#F08A7E;--badbg:#3A1F1C;--seal:#E0685A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);margin:0}
.w{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
h1{font-size:22px;margin:2px 0 2px;text-wrap:balance;display:flex;align-items:center;gap:10px}
.seal{font-family:var(--f-han);color:var(--seal);border:2px solid var(--seal);border-radius:6px;padding:0 6px;font-size:18px;line-height:1.4}
.sub{color:var(--sub);font-size:14px;margin:0 0 10px}
.lvls{display:flex;gap:6px;margin:10px 0 6px}
.lv{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 4px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;line-height:1.2}
.lv small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
.lv.on{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.lv.on small{color:var(--acink);opacity:.85}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .25s}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tb{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 4px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.tb.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.chip,.tg{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:16px;font:inherit;font-size:14px;cursor:pointer}
.chip.on,.tg.on{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.tgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.r{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.r.k{background:var(--hl);border-color:var(--ac)}
.h{font-family:var(--f-han);font-size:32px;line-height:1.15;min-width:76px}
.m{flex:1;min-width:0}
.p{color:var(--ac);font-weight:600}
.ru{font-size:15px}
.ex{color:var(--sub);font-size:14px;margin-top:3px}
.ex b{font-weight:400;color:var(--ink);font-family:var(--f-han)}
.ex span{display:block}
.ep{color:var(--ac);font-size:14px}
.ck{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--sub);font-size:18px;cursor:pointer}
.k .ck{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.hp .p,.hp .ep,.hp .dp,.hr .ru,.hr .ex span,.hr .dr{filter:blur(7px)}
.o .p,.o .ep,.o .ru,.o .ex span,.o .dp,.o .dr{filter:none!important}
.tabs{grid-template-columns:repeat(4,1fr)}
.au{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--ac);background:transparent;color:var(--ac);cursor:pointer;display:inline-grid;place-items:center;padding:0;vertical-align:middle}
.au svg{width:16px;height:16px;fill:currentColor}
.au.c{border-style:dashed}
.au.pl{background:var(--ac);color:var(--acink)}
.big .au{width:40px;height:40px;margin-left:8px;vertical-align:middle}
.tok[data-k]{cursor:pointer}
.tok[data-k] b::after{content:" ♪";font-size:11px;color:var(--ac);font-family:var(--f-body)}
.foot{font-size:12px;color:var(--sub);margin-top:24px;border-top:1px solid var(--line);padding-top:10px}
.foot a{color:var(--ac)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);font-weight:600}
.qtext{font-family:var(--f-han);font-size:22px;line-height:1.5}
.qp{color:var(--ac);font-size:14px}
.qq{margin-top:10px;font-family:var(--f-han);font-size:18px}
.optp{display:block;color:var(--sub);font-size:13px}
.slots{min-height:52px;border:1px dashed var(--line);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;font-family:var(--f-han);font-size:20px}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.wb{font-family:var(--f-han);font-size:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.wb.used{opacity:.3}
.sc{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.sc div{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card);font-variant-numeric:tabular-nums}
.sc b{display:block;font-size:20px}
.warn{font-size:13px;color:var(--sub);background:var(--hl);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.rq{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;overflow:hidden}
.rq .ln{border-top:0}
.rq .ln+.ln{border-top:1px dashed var(--line)}
.rq .note{margin:0 14px 10px}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cn{font-size:13px;color:var(--sub);margin:14px 0 6px;letter-spacing:.02em}
.e{text-align:center;color:var(--sub);padding:30px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px 16px;text-align:center;margin:8px 0 12px;min-height:160px;cursor:pointer}
.big{font-family:var(--f-han);font-size:56px;line-height:1.2}
.card .ex{margin-top:10px}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{background:var(--hl);border-color:var(--ac)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.tkg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.tkb{padding:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;line-height:1.25;font-variant-numeric:tabular-nums}
.tkb small{display:block;font-size:11px;color:var(--sub)}
.tkb.pr{border-color:var(--ac)}
.tkb.ok{background:var(--hl);border-color:var(--ac)}
.tkb.bad{border-color:var(--bad);background:var(--badbg)}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.dt{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
.dt.ok{background:var(--hl);border-color:var(--ac)}
.dt.bad{border-color:var(--bad);background:var(--badbg)}
.dt.cur{outline:2px solid var(--ac)}
.hl{font-size:14px;color:var(--sub);border-top:1px solid var(--line);padding:6px 0;font-variant-numeric:tabular-nums}
.lt{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-left:4px;white-space:nowrap}
/* dialogues */
.dlg{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.dlg>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.dlg>summary::-webkit-details-marker{display:none}
.dlg>summary::after{content:"＋";color:var(--sub)}
.dlg[open]>summary::after{content:"－"}
.note{margin:0 14px 10px;padding:10px 12px;background:var(--hl);border-radius:8px;font-size:14px}
.ln{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:10px;cursor:pointer}
.sp{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;display:grid;place-items:center;font-weight:600}
.sp.b{background:var(--ac);color:var(--acink)}
.lc{flex:1;min-width:0}
.dh{font-family:var(--f-han);font-size:21px;line-height:1.5}
.dp{color:var(--ac);font-size:14px}
.dr{font-size:15px}
.bd{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bd[hidden]{display:none!important}
.tok{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;line-height:1.3;min-width:0}
.tok b{font-family:var(--f-han);font-size:17px;font-weight:500;display:block}
.tok i{font-style:normal;color:var(--ac)}
.tok.x{border-style:dashed}
.sent{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.sent .note{margin:8px 0 0;padding:6px 10px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="w">
<h1><span class="seal">汉</span><span id="ttl">HSK 1</span></h1>
<p class="sub" id="desc"></p>

<div id="st" class="sub"></div><div class="bar"><i id="pb"></i></div>

<button class="tb" data-t="m">Пробник</button><button class="tb" data-t="c">Иероглифы</button><button class="tb" data-t="d">Диалоги</button><button class="tb" data-t="x">Реплики</button>

<div id="tw">

<div id="list"></div>
</div>
<div id="tf" hidden></div><div id="tq" hidden></div><div id="tt" hidden></div><div id="tc" hidden></div>
<div id="td" hidden>
<div class="tgs"><button class="tg" id="dp">Скрыть пиньинь</button><button class="tg" id="dr">Скрыть перевод</button><button class="tg on" id="db">Разбор слов</button></div>
<div id="dl"></div>
</div>
<div id="tm" hidden></div>
<div id="tx" hidden>
<div class="tgs"><button class="tg" id="xp">Скрыть пиньинь</button><button class="tg" id="xr">Скрыть перевод</button><button class="tg on" id="xb">Разбор слов</button></div>
<div id="xl"></div>
</div>
<p class="foot">Озвучка слов: живые записи носителей из открытого проекта <a href="https://github.com/hugolpz/audio-cmn" target="_blank" rel="noopener">audio-cmn</a> (дикторы Yue Tan и Chen Wang, лицензия CC BY-SA). Кнопка с пунктирной рамкой — слово собрано из записей отдельных слогов, звучит медленнее живой речи. Списки слов: HSK 3.0, программа 2025 года.</p>
</div>
<script>

const tone0=p=>p.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[\s'’-]/g,"").toLowerCase();
function mkBuild(v){
  const R=rng(lv*1000+v),rs=()=>Math.floor(R()*1e9),pk=(a,n)=>sd(a,rs()).slice(0,n);
  const P=lv<3;/* пиньинь в вопросах для HSK 1–2 */

  const aw=all.filter(x=>AK[x.h+"|"+x.p]);

  const dist=(x,f,n)=>{const out=[],seen=new Set([f(x)]);for(const y of sd(all,rs())){const t=f(y);if(!seen.has(t)){seen.add(t);out.push(y)}if(out.length==n)break}return out};
  CFG[lv].parts.forEach(([sec,ty,n,title,task])=>{
    const add=it=>items.push(Object.assign(it,{sec,ty,title,task}));
    if(ty=="lh"||ty=="lm"){
      pk(aw.filter(x=>!used.has(x.id)),n).forEach(x=>{used.add(x.id);
        const f=ty=="lh"?(y=>y.h):(y=>y.r);
        const ds=dist(x,f,lv==1?2:3);const opts=sd([x,...ds],rs());
        add({k:x.h+"|"+x.p,w:x,opts:opts.map(y=>({t:f(y),p:ty=="lh"&&P?"":""})),ans:opts.indexOf(x)})})}
    if(ty=="fl"){
      const c=all.filter(x=>!used.has(x.id)&&x.e.split(x.h).length==2&&x.h.length<=3&&[...x.e].length-x.h.length>=4);
      pk(c,n).forEach(x=>{used.add(x.id);
        const nd=lv==1?2:3,cand=all.filter(y=>y.c!=x.c&&y.h!=x.h&&!x.e.includes(y.h)&&!x.e.includes(y.h[0]));
        const ds=[];for(const y of sd(cand.filter(y=>y.h.length==x.h.length),rs()).concat(sd(cand,rs()))){if(!ds.some(z=>z.h==y.h))ds.push(y);if(ds.length==nd)break}
        while(ds.length<(lv==1?2:3)){const y=all[rs()%all.length];if(y.h!=x.h&&!ds.includes(y)&&!x.e.includes(y.h))ds.push(y)}
        const opts=sd([x,...ds],rs());
        add({q:x.e.replace(x.h,"（　　）"),qr:x.t,w:x,opts:opts.map(y=>({t:y.h,p:P?y.p:""})),ans:opts.indexOf(x)})})}
    if(ty=="rp"){
      const rp=[];for(let k=1;k<=lv;k++)(LV[k].rp||[]).forEach(r=>rp.push(r));
      const mine=L.rp.slice();
      pk(mine,n).forEach(r=>{const ds=[];for(const y of sd(rp,rs())){if(y!==r&&y.a.h!=r.a.h&&!ds.some(z=>z.a.h==y.a.h))ds.push(y);if(ds.length==(lv==1?2:3))break}
        const opts=sd([r,...ds],rs());
        add({q:r.q.h,qp:P?r.q.p:"",opts:opts.map(y=>({t:y.a.h,p:P?y.a.p:""})),ans:opts.indexOf(r),ex:r})})}
    if(ty=="cm"){
      pk(L.cm,n).forEach(c=>{const order=sd(c.o.map((t,i)=>i),rs());
        add({q:c.h,qp:P?c.p:"",qq:c.q,qqp:P?c.qp:"",opts:order.map(i=>({t:c.o[i],p:P?c.op[i]:""})),ans:order.indexOf(c.a)})})}
    if(ty=="or"){
      pk(L.os,n).forEach(t=>{const sh2=sd(t.map((w,i)=>({w,i})),rs());add({toks:sh2.map(o=>o.w),ans:t.join(""),src:t})})}
    if(ty=="hz"){
      const c=all.filter(x=>[...x.h].length==1&&x.e.split(x.h).length==2&&!used.has(x.id));
      pk(c,n).forEach(x=>{used.add(x.id);
        const hom=[...new Set(pool.filter(y=>[...y.h].length==1&&y.h!=x.h&&tone0(y.p)==tone0(x.p)).map(y=>y.h))];
        let ds=sd(hom,rs()).slice(0,3);
        for(const y of sd(pool,rs())){if(ds.length>=3)break;if([...y.h].length==1&&y.h!=x.h&&!ds.includes(y.h))ds.push(y.h)}
        const opts=sd([x.h,...ds],rs());
        add({q:x.e.replace(x.h,"（"+x.p+"）"),qr:x.t,w:x,opts:opts.map(t=>({t,p:""})),ans:opts.indexOf(x.h)})})}
  });
  return items;
}

  <div class="card" style="cursor:default"><div class="sub">HSK ${lv} · вариант ${mk.v}</div><div class="big">${pc}%</div><div>${S} из ${T} · ${pc>=60?"выше ориентира 60%":"ниже ориентира 60%"} · время ${mk.dur}</div></div>
  <div class="sc">${Object.entries(by).map(([k,v])=>`<div>${SECN[k]}<b>${v.s}/${v.t}</b></div>`).join("")}</div>
  ${wrong.length?`<div class="cn">Ошибки (${wrong.length})</div>`+wrong.map(([it,a])=>`<div class="r" style="cursor:default"><div class="m"><div class="sec">${it.title}</div>${it.q?`<div class="qtext" style="font-size:18px">${it.q}</div>`:""}${it.qq?`<div>问：${it.qq}</div>`:""}${it.w?`<div><b style="font-family:var(--f-han);font-size:20px">${it.w.h}</b> <span class="p">${it.w.p}</span> ${esc(it.w.r)} ${auB(it.w)}</div>`:""}<div class="ex">Твой ответ: ${esc(showA(it,a))}<br>Правильно: <b>${esc(right(it))}</b></div>${it.qr?`<div class="ex">${esc(it.qr)}</div>`:""}</div></div>`).join(""):'<div class="e">Без ошибок!</div>'}
  <div class="tgs"><button class="tg on" id="mre">Пройти этот вариант заново</button></div>`}
function mkFinish(){
  const sec=Math.round((Date.now()-mk.t0)/1000);mk.dur=fmtT(sec);mk.done=true;
  const S=mk.items.filter((it,i)=>mkCorrect(it,mk.ans[i])).length,T=mk.items.length;
  const by={};mk.items.forEach((it,i)=>{const s=by[it.sec]||(by[it.sec]={s:0,t:0});s.t++;if(mkCorrect(it,mk.ans[i]))s.s++});
  const H=ls.get(mkKey(),{b:{},h:[]});const pc=Math.round(100*S/T);
  H.b[mk.v]=Math.max(H.b[mk.v]??0,pc);
  H.h.push({v:mk.v,s:S,t:T,p:Object.entries(by).map(([k,v])=>SECN[k]+" "+v.s+"/"+v.t).join(", "),dur:mk.dur,d:new Date().toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})});
  ls.set(mkKey(),H);mkRender()}
$("tm").onclick=e=>{const b=e.target.closest("button");if(!b||b.classList.contains("au"))return;
  if(b.dataset.v){const v=+b.dataset.v;mk={v,items:mkBuild(v),i:0,t0:Date.now()};mk.ans=mk.items.map(()=>null)}
  else if(b.id=="mq"){mk=null}
  else if(b.id=="mre"){const v=mk.v;mk={v,items:mkBuild(v),i:0,t0:Date.now()};mk.ans=mk.items.map(()=>null)}
  else if(b.dataset.j){mk.i=+b.dataset.j}
  else if(b.id=="mprev"){mk.i--}
  else if(b.id=="mnext"){mk.i++}
  else if(b.id=="mfin"){const left=mk.ans.filter(x=>x==null||(Array.isArray(x)&&!x.length)).length;
    if(left&&!mk.conf){mk.conf=1;$("mconf").innerHTML=`<div class="warn">Без ответа: ${left}. Нажми «Завершить и проверить» ещё раз, чтобы закончить.</div>`;return}
    mkFinish();return}
  else if(b.dataset.a!=null){mk.ans[mk.i]=+b.dataset.a;mk.conf=0}
  else if(b.dataset.o!=null){const it=mk.items[mk.i],a=mk.ans[mk.i]||[];const o=+b.dataset.o;if(!a.includes(o)){a.push(o);mk.ans[mk.i]=a;mk.conf=0}}
  else if(b.id=="mclr"){mk.ans[mk.i]=null}
  else return;
  mkRender()};

/* ---------- replies ---------- */
function repRender(){let out="",c=null;
  L.rp.forEach(r=>{if(r.c!=c){c=r.c;out+=`<div class="cn">${esc(c)}</div>`}
    out+=`<div class="rq">`+[["A",r.q],["B",r.a]].map(([w,l])=>`<div class="ln"><div class="sp${w=="B"?" b":""}">${w}</div><div class="lc"><div class="dh">${l.h}</div><div class="dp">${l.p}</div><div class="dr">${esc(l.r)}</div><div class="bd">${l.k.map(tokHtml).join("")}</div></div></div>`).join("")+`<div class="note">${esc(r.n)}</div></div>`});
  $("xl").innerHTML=out;applyXb()}
let showXb=true;const applyXb=()=>document.querySelectorAll("#xl .bd").forEach(b=>b.hidden=!showXb);
$("xb").onclick=e=>{showXb=!showXb;e.target.classList.toggle("on",showXb);applyXb()};
$("xp").onclick=e=>{$("tx").classList.toggle("hp");e.target.classList.toggle("on")};
$("xr").onclick=e=>{$("tx").classList.toggle("hr");e.target.classList.toggle("on")};
$("xl").onclick=e=>{const k=e.target.closest(".tok[data-k]");if(k){play(k.dataset.k);return}const l=e.target.closest(".ln");if(l)l.classList.toggle("o")};

setup();go("w");
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
